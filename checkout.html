{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="page-title">🚪 Customer Checkout</div>
<div class="card" style="max-width:520px;margin:0 auto;">
  {% if customers %}
  <p style="margin-bottom:16px;color:#555;">Current guests checked in:</p>
  <div style="background:#f0f5fb;padding:14px;border-radius:8px;margin-bottom:20px;">
    {% for c in customers %}
      <div style="padding:6px 0;border-bottom:1px solid #dde4ee;">
        <strong>{{ c.name }}</strong> — Room {{ c.room_id }}
      </div>
    {% endfor %}
  </div>
  {% endif %}
  <form method="POST" action="/checkout">
    <div class="form-group">
      <label>👤 Guest Name (to checkout)</label>
      <input type="text" name="name" placeholder="Enter full name exactly" required/>
    </div>
    <div class="form-group">
      <label>💰 Final Payment Amount (PKR)</label>
      <input type="number" name="amount" placeholder="0.00" step="0.01" min="0"/>
      <small class="text-muted">Leave blank or 0 if already paid.</small>
    </div>
    <button type="submit" class="btn btn-danger" style="width:100%;padding:13px;margin-top:6px;">🚪 Confirm Checkout</button>
  </form>
</div>
{% endblock %}
