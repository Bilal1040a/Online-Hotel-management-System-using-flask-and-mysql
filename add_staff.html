{% extends "base.html" %}
{% block title %}Add Staff{% endblock %}
{% block content %}
<div class="page-title">➕ Add Staff Member</div>
<div class="card" style="max-width:520px;margin:0 auto;">
  <form method="POST" action="/staff/add">
    <div class="form-group">
      <label>👤 Full Name</label>
      <input type="text" name="name" placeholder="Staff member name" required/>
    </div>
    <div class="form-group">
      <label>💼 Position / Role</label>
      <select name="position" required>
        <option value="">Select role...</option>
        <option value="Manager">Manager</option>
        <option value="Receptionist">Receptionist</option>
        <option value="Cleaner">Cleaner</option>
        <option value="Security">Security</option>
        <option value="Chef">Chef</option>
        <option value="Bellboy">Bellboy</option>
        <option value="Accountant">Accountant</option>
        <option value="IT Support">IT Support</option>
      </select>
    </div>
    <div class="form-group">
      <label>📧 Email (optional)</label>
      <input type="email" name="email" placeholder="staff@hotel.com"/>
    </div>
    <button type="submit" class="btn btn-success" style="width:100%;padding:13px;">✅ Add Staff Member</button>
  </form>
</div>
{% endblock %}
