{% extends "base.html" %}
{% block title %}Book a Room{% endblock %}
{% block content %}

<div class="page-title">📋 Book a Room</div>

<div class="card" style="max-width:680px;margin:0 auto;">
  <form method="POST" action="/book">
    <div class="form-row">
      <div class="form-group">
        <label>👤 Guest Name</label>
        <input type="text" name="name" placeholder="Full name" required/>
      </div>
      <div class="form-group">
        <label>🪪 CNIC</label>
        <input type="text" name="cnic" placeholder="e.g. 35202-1234567-1" required/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>📍 Location / City</label>
        <input type="text" name="location" placeholder="e.g. Rawalpindi" required/>
      </div>
      <div class="form-group">
        <label>💳 Payment Method</label>
        <select name="payment_method" required>
          <option value="">Select method...</option>
          <option value="Cash">Cash</option>
          <option value="Credit Card">Credit Card</option>
          <option value="Debit Card">Debit Card</option>
          <option value="Online Transfer">Online Transfer</option>
          <option value="JazzCash">JazzCash</option>
          <option value="EasyPaisa">EasyPaisa</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>📅 Check-In Date</label>
        <input type="date" name="check_in" required/>
      </div>
      <div class="form-group">
        <label>📅 Check-Out Date</label>
        <input type="date" name="check_out" required/>
      </div>
    </div>
    <div style="background:#f0f5fb;padding:14px;border-radius:8px;margin-bottom:18px;font-size:.9rem;color:#555;">
      ℹ️ The first available room will be automatically assigned to the guest.
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;">✅ Confirm Booking</button>
  </form>
</div>

{% endblock %}
